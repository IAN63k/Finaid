name: finaid_ios
description: Puente nativo de Finaid para iOS (Face ID, archivos y avisos locales).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FinaidIosPlugin
