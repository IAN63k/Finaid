name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repo no versiona la capa Gradle ni los iconos que genera Flutter, para que
      # siempre coincidan con la versión de Flutter instalada (3.47 exige Gradle 9.3+).
      # `flutter create` no sobreescribe los archivos existentes (manifest, Kotlin, res).
      - name: Complete platform scaffold
        run: flutter create . --project-name finaid --org co --platforms android

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      # NOTE: release build currently uses the debug signing config (see android/app/build.gradle.kts).
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/finaid-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/finaid-${{ github.ref_name }}.apk
          generate_release_notes: true
