name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & publish release
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repo no versiona la capa Gradle ni los iconos que genera Flutter, para que
      # siempre coincidan con la versión de Flutter instalada (3.47 exige Gradle 9.3+).
      # `flutter create` no sobreescribe los archivos existentes (manifest, Kotlin, res).
      - name: Complete platform scaffold
        run: flutter create . --project-name finaid --org co --platforms android

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      # Firma estable si existen los secretos (tool/setup_signing.ps1). Si no, se usa una
      # llave efímera: el APK sigue instalándose, pero no actualiza el anterior. En ambos
      # casos se aplica el mismo bloque de firma, así queda probado en cada release.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/finaid-release.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="${KEY_ALIAS:-finaid}"
            echo "Usando la llave estable del repositorio."
          else
            STORE_PASS="$(openssl rand -hex 16)"
            ALIAS="finaid"
            keytool -genkeypair -noprompt -keystore android/app/finaid-release.jks \
              -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 30 \
              -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=Finaid CI, O=Finaid, C=CO"
            echo "::warning::Sin secretos de firma: APK con llave efímera (no actualiza instalaciones previas). Ver tool/setup_signing.ps1"
          fi
          {
            echo "storeFile=finaid-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$STORE_PASS"
          } > android/key.properties
          cat android/release-signing.gradle.snippet >> android/app/build.gradle.kts

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/finaid-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/finaid-${{ github.ref_name }}.apk
          generate_release_notes: true
